name: Build MyBypassXray APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Xray-core and compile hev-socks5-tunnel (arm64-v8a)
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$(ls -d "$SDK_DIR"/ndk/* 2>/dev/null | sort -V | tail -n 1)}}"
          echo "Using NDK: $NDK_DIR"

          JNI_OUT="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_OUT"

          # 1. Скачивание официального Xray-core под Android arm64-v8a
          mkdir -p /tmp/xray
          curl -fSL "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-android-arm64-v8a.zip" -o /tmp/xray/xray.zip
          unzip -o /tmp/xray/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray
          cp /tmp/xray/xray "$JNI_OUT/libxray.so"

          # 2. Сборка hev-socks5-tunnel (JNI tun2socks) с 16KB выравниванием
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev-socks5-tunnel
          cd /tmp/hev-socks5-tunnel
          "$NDK_DIR/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-24 \
            APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true \
            PKGNAME=hev/htproxy \
            CLSNAME=TProxyService \
            NDK_LIBS_OUT=/tmp/hev-libs \
            NDK_OUT=/tmp/hev-obj
          cp /tmp/hev-libs/arm64-v8a/libhev-socks5-tunnel.so "$JNI_OUT/"

          # 3. Автогенерация TProxyService.java строго по сигнатурам из src/hev-jni.c
          python3 - "$GITHUB_WORKSPACE/app/src/main/java/hev/htproxy/TProxyService.java" <<'PYEOF'
          import re, sys

          with open("/tmp/hev-socks5-tunnel/src/hev-jni.c", "r", encoding="utf-8") as f:
              src = f.read()

          src = re.sub(r'/\*.*?\*/', '', src, flags=re.S)
          src = re.sub(r'//.*', '', src)

          m = re.search(r'JNINativeMethod\s+\w+\s*\[\s*\]\s*=\s*\{(.*?)\};', src, re.S)
          assert m, "JNINativeMethod not found in src/hev-jni.c"

          pairs = re.findall(r'"([^"]+)"\s*,\s*"(\([^)]*\)[^"]+)"', m.group(1))
          assert pairs, "No native methods found in src/hev-jni.c"

          prim = {
              'V': 'void', 'Z': 'boolean', 'B': 'byte', 'C': 'char',
              'S': 'short', 'I': 'int', 'J': 'long', 'F': 'float', 'D': 'double'
          }

          def parse_type(sig, idx):
              arr = ""
              while idx < len(sig) and sig[idx] == '[':
                  arr += "[]"
                  idx += 1
              c = sig[idx]
              if c in prim:
                  return prim[c] + arr, idx + 1
              if c == 'L':
                  end = sig.index(';', idx)
                  return sig[idx + 1:end].replace('/', '.') + arr, end + 1
              raise ValueError("Unknown JNI type: " + sig[idx:])

          lines = [
              "package hev.htproxy;",
              "",
              "public final class TProxyService {",
              "    static {",
              '        System.loadLibrary("hev-socks5-tunnel");',
              "    }",
              ""
          ]

          for name, sig in pairs:
              idx = 1
              params = []
              p_i = 0
              while sig[idx] != ')':
                  t, idx = parse_type(sig, idx)
                  params.append(f"{t} p{p_i}")
                  p_i += 1
              ret, _ = parse_type(sig, idx + 1)
              lines.append(f"    public static native {ret} {name}({', '.join(params)});")

          lines.append("}")
          code = "\n".join(lines) + "\n"
          print("--- Generated TProxyService.java ---")
          print(code)

          with open(sys.argv[1], "w", encoding="utf-8") as f:
              f.write(code)
          PYEOF

          ls -lh "$JNI_OUT"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBypassXray-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
