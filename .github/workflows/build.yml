name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Xray core and compile hev-socks5-tunnel & ByeDPI (arm64-v8a)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/xray /tmp/hev

          XRAY_URL=$(curl -sL https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            | grep "browser_download_url.*Xray-android-arm64-v8a.zip\"" \
            | cut -d '"' -f 4)
          curl -sL "$XRAY_URL" -o /tmp/xray/xray.zip
          unzip -o /tmp/xray/xray.zip -d /tmp/xray
          cp /tmp/xray/xray app/src/main/jniLibs/arm64-v8a/libxray.so

          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)

          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev/jni
          "$NDK_DIR/ndk-build" -C /tmp/hev APP_ABI=arm64-v8a APP_PLATFORM=android-21
          cp /tmp/hev/libs/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/

          git clone --depth 1 https://github.com/hufrea/byedpi.git /tmp/byedpi
          NDK_CC=$(find "$NDK_DIR/toolchains/llvm/prebuilt" -name "aarch64-linux-android21-clang" | head -n 1)
          make -C /tmp/byedpi CC="$NDK_CC" CFLAGS="-I. -std=c99 -O2 -D_DEFAULT_SOURCE -D_GNU_SOURCE"
          cp /tmp/byedpi/ciadpi app/src/main/jniLibs/arm64-v8a/libciadpi.so

          chmod +x app/src/main/jniLibs/arm64-v8a/*.so

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-dyadi-andreya-debug
          path: app/build/outputs/apk/debug/app-debug.apk
